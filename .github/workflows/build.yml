name: Test and package Forever Nameplates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install development tools
        run: python -m pip install -r requirements-dev.lock
      - name: Verify bundled libraries
        run: python Tools/vendor_libraries.py
      - name: Run Lua and asset tests
        run: python -m pytest -q
      - name: Package addon
        run: python Tools/package.py
      - name: Upload installable addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ForeverNameplates
          path: dist/ForeverNameplates-*.zip
          if-no-files-found: error
          retention-days: 30
